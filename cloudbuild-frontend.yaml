steps:
  # Builds the frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_API_URL=https://recipe-backend-145870669031.us-central1.run.app'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/recipe-images/recipe-frontend:latest'
      - './frontend'

  # Pushes the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/recipe-images/recipe-frontend:latest'

  # Deploys frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'recipe-frontend'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/recipe-images/recipe-frontend:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=80'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/recipe-images/recipe-frontend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
